[package]
name = "pato"
version = "0.1.0"
description = "Local WASM Plugin Host Platform"
authors = ["SnareChops"]
license = "MIT"
repository = "https://github.com/SnareChops/pato"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "48", features = ["component-model", "async"] }
wasmtime-wasi = { version = "48", features = ["p3"] }
wasmtime-wasi-http = { version = "48", features = ["p3"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
dashmap = "6.1.0"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
